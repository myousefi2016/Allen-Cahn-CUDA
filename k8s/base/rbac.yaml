kind: RoleBinding
metadata:
  name: allen-cahn-rolebinding
  labels:
    app.kubernetes.io/name: allen-cahn-cuda
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: allen-cahn-cuda
roleRef:
  apiGroup: rbac.authorization.k8s.io
