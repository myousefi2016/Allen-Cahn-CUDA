apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: allen-cahn-cuda-base

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/version: "1.0.0"

resources:
  - configmap.yaml
  - pvc.yaml
  - rbac.yaml
  - networkpolicy.yaml
  - job.yaml

# The simulation image, as published by the release-docker job in
# .github/workflows/ci.yml (docker/metadata-action lowercases
# ghcr.io/${{ github.repository }}; `latest` tracks the default branch,
# `sha-<commit>` pins a build). To pin one in an overlay, match the name
# rewritten here:
#   kustomize edit set image ghcr.io/myousefi2016/allen-cahn-cuda:sha-<commit>
images:
  - name: allen-cahn-cuda
    newName: ghcr.io/myousefi2016/allen-cahn-cuda
    newTag: latest
