apiVersion: apps/v1
kind: Deployment
metadata:
  name: allen-cahn-worker
  labels:
    app.kubernetes.io/name: allen-cahn-cuda
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: allen-cahn-cuda
  annotations:
    description: >-
      Scalable simulation worker for batch processing pattern.
      Multiple workers process simulation jobs from a parameter queue.
      Scale via HPA based on GPU utilization.
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: allen-cahn-cuda
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: allen-cahn-cuda
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: allen-cahn-cuda
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      terminationGracePeriodSeconds: 60
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: allen-cahn-cuda
          image: allen-cahn-cuda:latest
          imagePullPolicy: IfNotPresent
          args:
            - "/config/simulation.json"
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: config-volume
              mountPath: /config
              readOnly: true
            - name: output-volume
              mountPath: /data/output
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
          livenessProbe:
            exec:
              command:
                - test
                - -f
                - /tmp/healthy
            initialDelaySeconds: 30
            periodSeconds: 60
      volumes:
        - name: config-volume
          configMap:
            name: allen-cahn-config
        - name: output-volume
          persistentVolumeClaim:
            claimName: allen-cahn-output
