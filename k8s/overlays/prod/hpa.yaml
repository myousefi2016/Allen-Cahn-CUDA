apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: allen-cahn-worker-hpa
  labels:
    app.kubernetes.io/name: allen-cahn-cuda
    app.kubernetes.io/component: autoscaler
    app.kubernetes.io/part-of: allen-cahn-cuda
  annotations:
    description: >-
      Scales simulation worker replicas based on GPU utilization.
      Workers process simulation jobs from a parameter queue.
      Requires NVIDIA DCGM exporter for GPU metrics.
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: allen-cahn-worker
  minReplicas: 1
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
  metrics:
    - type: Pods
      pods:
        metric:
          name: nvidia_gpu_utilization
        target:
          type: AverageValue
          averageValue: "80"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
