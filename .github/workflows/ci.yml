name: CI/CD Pipeline

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  CUDA_VERSION: "12.6.0"
  CMAKE_GENERATOR: Ninja

jobs:
  # ── Format Check ────────────────────────────────────────────────────────────
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          find src tests -type f \( -name '*.cpp' -o -name '*.cu' -o -name '*.cuh' -o -name '*.hpp' -o -name '*.h' \) \
            | xargs clang-format-18 --dry-run --Werror 2>&1 || {
              echo "::error::Code formatting check failed. Run 'make format' locally to fix."
              exit 1
            }

  # ── Clang-Tidy ──────────────────────────────────────────────────────────────
  clang-tidy:
    name: Clang-Tidy
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.6.0-devel-ubuntu24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-13 g++-13 clang-tidy-18 \
            libvtk9-dev libhdf5-dev \
            git ca-certificates python3 python3-yaml
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
          update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100

      - name: Configure CMake (generate compile_commands.json)
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES="70;80;90" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DAC_BUILD_TESTS=ON

      - name: Run clang-tidy on C++ sources
        run: |
          find src -type f -name '*.cpp' -o -name '*.hpp' \
            | xargs clang-tidy -p build --warnings-as-errors='' 2>&1 \
            | tee clang-tidy-output.txt
          if grep -q "warning:" clang-tidy-output.txt; then
            echo "::warning::clang-tidy found warnings (non-blocking)"
          fi

  # ── Build & Test (CUDA) ─────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (CUDA ${{ matrix.cuda }})
    runs-on: [self-hosted, gpu, linux]
    # Fork pull requests are never scheduled onto the self-hosted GPU runner.
    # This condition is only a convenience (a fork can edit it); the runner
    # itself refuses every job not triggered by the repository owner from
    # this repository, see ci/gpu-runner/job-started-guard.sh.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cuda: ["12.6.0"]
        build_type: [Debug, Release]
    container:
      image: nvidia/cuda:${{ matrix.cuda }}-devel-ubuntu24.04
      options: --gpus all
    env:
      DEBIAN_FRONTEND: noninteractive
      # CUDA tests fail instead of skipping if the GPU is not usable here.
      AC_REQUIRE_GPU: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-13 g++-13 \
            libvtk9-dev libhdf5-dev \
            git ca-certificates python3 python3-yaml
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CUDA_ARCHITECTURES=native \
            -DAC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run Unit Tests
        run: |
          cd build
          ctest --output-on-failure --no-tests=error --parallel $(nproc) -R "^unit[.]" --timeout 300

      - name: Run Integration Tests
        run: |
          cd build
          ctest --output-on-failure --no-tests=error --parallel $(nproc) -R "^integration[.]" --timeout 600

      - name: Run End-to-End Tests
        run: |
          cd build
          ctest --output-on-failure --no-tests=error -R "^e2e[.]" --timeout 600

  # ── Build & Test (CPU-only, no GPU) ─────────────────────────────────────────
  # Runs every discovered test. CPU suites execute for real; CUDA suites
  # GTEST_SKIP because the hosted runner has no GPU (reported as Skipped).
  build-cpu-only:
    name: Build & CPU Tests (no GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: nvidia/cuda:12.6.0-devel-ubuntu24.04
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-13 g++-13 \
            libvtk9-dev libhdf5-dev \
            git ca-certificates python3 python3-yaml
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES="70;80;90" \
            -DAC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run tests (CPU suites execute, GPU suites skip)
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error \
            --parallel $(nproc) --timeout 300

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/src/allen-cahn-cuda
            build/tests/
          retention-days: 7

  # ── Visualization toolkit (headless, no GPU) ────────────────────────────────
  # End-to-end check of scripts/visualize_dendrite.py on synthetic .vts data:
  # prescan, saturation detection, both layouts, --skip-saturated,
  # --scan-json and MP4 stitching. Also runs the checkpoint-selection tests of
  # scripts/resume_from_latest_checkpoint.py (stdlib only).
  viz-smoke:
    name: Visualization Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install headless rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglu1-mesa libxrender1 libxext6 libsm6 libice6 \
            libxt6 libfontconfig1 libglx-mesa0 libosmesa6 ffmpeg

      - name: Install Python requirements
        run: pip install -r scripts/requirements.txt

      - name: Run visualizer self-test
        run: python scripts/visualize_dendrite.py --self-test

      - name: Run visualizer smoke test
        run: python tests/visualize_smoke.py

      - name: Run resume-checkpoint helper tests
        run: python tests/test_resume_checkpoint.py

      - name: Run GPU-runner guard tests
        run: python tests/test_gpu_runner_guard.py -v

  # ── Docker Build ────────────────────────────────────────────────────────────
  # Builds every docker/Dockerfile.<target>, loads it into the local daemon and
  # checks (no GPU needed) that the image's runtime user exists with the
  # expected UID and can write its working and output directories.
  docker-build:
    name: Docker Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [dev, test, prod, cuda-dev]
        include:
          - target: dev
            user: developer
            uid: "1000"
            workdir: /workspace
            write_dirs: /workspace /workspace/build /workspace/.ccache
          - target: test
            user: tester
            uid: "1000"
            workdir: /build
            write_dirs: /build /build/build/debug
          - target: prod
            user: simulator
            uid: "1000"
            workdir: /output
            write_dirs: /output
          # Root by design: the cuda-* make targets chown results back to the
          # host user (CUDA_CHOWN), see docker/Dockerfile.cuda-dev.
          - target: cuda-dev
            user: root
            uid: "0"
            workdir: /work
            write_dirs: /work
    steps:
      - uses: actions/checkout@v4

      # The CUDA devel base image is several GB, and `load: true` stores the
      # built image a second time in the Docker daemon.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (${{ matrix.target }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.target }}
          push: false
          load: true
          tags: allen-cahn-cuda:${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Verify runtime user and writable directories (${{ matrix.target }})
        env:
          EXPECT_USER: ${{ matrix.user }}
          EXPECT_UID: ${{ matrix.uid }}
          EXPECT_WORKDIR: ${{ matrix.workdir }}
          WRITE_DIRS: ${{ matrix.write_dirs }}
        run: |
          docker run --rm --entrypoint sh \
            -e EXPECT_USER -e EXPECT_UID -e EXPECT_WORKDIR -e WRITE_DIRS \
            allen-cahn-cuda:${{ matrix.target }} -c '
              set -eu
              fail() { echo "::error::$*"; exit 1; }
              id
              [ "$(id -un)" = "$EXPECT_USER" ] || fail "runs as $(id -un), expected $EXPECT_USER"
              [ "$(id -u)" = "$EXPECT_UID" ] || fail "UID $(id -u), expected $EXPECT_UID"
              [ "$(pwd)" = "$EXPECT_WORKDIR" ] || fail "workdir $(pwd), expected $EXPECT_WORKDIR"
              for d in $WRITE_DIRS; do
                touch "$d/.ci-write-probe" || fail "$EXPECT_USER cannot write $d"
                rm "$d/.ci-write-probe"
                echo "writable: $d"
              done
            '

  # ── Kubernetes Manifests Validation ─────────────────────────────────────────
  k8s-validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install kubeconform (offline schema validator)
        run: |
          curl -L -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validate base manifests (kubeconform, offline)
        run: |
          # Render the base kustomization, then validate all rendered manifests
          # against the bundled OpenAPI schemas. Skips kustomization.yaml (not a
          # K8s resource) and skips CRDs we don't ship.
          kubectl kustomize k8s/base | \
            kubeconform -strict -summary -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

      - name: Validate dev overlay (render + kubeconform)
        run: |
          kubectl kustomize k8s/overlays/dev | \
            kubeconform -strict -summary -ignore-missing-schemas

      - name: Validate prod overlay (render + kubeconform)
        run: |
          kubectl kustomize k8s/overlays/prod | \
            kubeconform -strict -summary -ignore-missing-schemas

  # ── Release Docker Images ───────────────────────────────────────────────────
  release-docker:
    name: Push Docker Images
    runs-on: ubuntu-latest
    needs: [build-and-test, build-cpu-only, viz-smoke, docker-build, format-check, k8s-validate]
    # Publish from the repository's default branch (master here; no `main`
    # exists), which is what the k8s manifests' `latest` tag tracks.
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercased by the action: ghcr.io/myousefi2016/allen-cahn-cuda,
          # the image k8s/base/kustomization.yaml deploys.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod
